dependencies:
  idf:
    version: ">=6.0.0-beta2"
  # adafruit/esp-usb fsls-only + hub port power API and hub handling fixes
  espressif/usb:
    git: https://github.com/tyeth-ai-assisted/esp-usb.git
    path: host/usb
    version: 8ed72c7f5c2700ba8bdccf2775e27c4b0f3b5c21
  espressif/mdns:
    version: ">=1.9.1"
  espressif/cjson:
    version: ">=1.7.17"
  logic_capture:
    git: https://github.com/adafruit/esp-perfetto-logic.git
    path: components/logic_capture
    version: main
    rules:
      - if: "target in [esp32p4]"
  perfetto_trace:
    git: https://github.com/adafruit/esp-perfetto-logic.git
    path: components/perfetto_trace
    version: main
    rules:
      - if: "target in [esp32p4]"
  sump:
    git: https://github.com/adafruit/esp-perfetto-logic.git
    path: components/sump
    version: main
    rules:
      - if: "target in [esp32p4]"
  sump_io:
    git: https://github.com/adafruit/esp-perfetto-logic.git
    path: components/sump_io
    version: main
    rules:
      - if: "target in [esp32p4]"
